<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buổi 9 - Bài 2: Navbar &amp; Banner Responsive</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; }
/* ===== NAVBAR: mobile menu xếp dọc xuống dưới, từ tablet trở lên nằm ngang ===== */
.navbar {
display: flex;
flex-wrap: wrap;
justify-content: space-between;
align-items: center;
padding: 16px 24px;
background: #2c3e50;
color: #fff;
}
.logo { font-size: 1.3rem; font-weight: bold; }
.nav-links {
display: flex;
flex-direction: column; /* mobile: menu xếp dọc */
width: 100%;
order: 3; /* đẩy menu xuống dưới cùng trên mobile */
list-style: none;

gap: 8px;
margin-top: 12px;
}
.nav-links a { color: #fff; text-decoration: none; }
.btn-cart {
padding: 8px 16px; border: none; border-radius: 6px;
background: #e74c3c; color: #fff; cursor: pointer;
}
@media (min-width: 768px) {
.nav-links {
flex-direction: row;
width: auto;
order: 0;
margin-top: 0;
gap: 20px;
}
}
/* ===== BANNER: chữ tự co giãn bằng clamp(), không bao giờ quá to/quá nhỏ ===== */
.banner {
height: 60vh;
min-height: 260px;
background:
linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.6)),
url('https://picsum.photos/id/180/1600/600');
background-size: cover;
background-position: center;
color: #fff;
display: flex;

flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
padding: 0 20px;
}
.banner h1 {
/* Không nhỏ hơn 24px, không lớn hơn 56px, còn lại tự co giãn theo 5vw */
font-size: clamp(24px, 5vw, 56px);
margin-bottom: 10px;
}
.banner p {
font-size: clamp(14px, 2vw, 20px);
}
/* ===== CONTAINER: rộng 92% màn hình nhưng không bao giờ vượt quá 1100px ===== */
.page-container {
width: min(92%, 1100px);
margin: 0 auto;
padding: 32px 0;
}
.product-grid {
display: flex;
flex-wrap: wrap;
gap: 16px;
}
.product-card {
flex: 1 1 200px;

border: 1px solid #eee;
border-radius: 8px;
padding: 10px;
text-align: center;
}
/* ===== object-fit: ảnh luôn đẹp, không bị méo dù tỉ lệ gốc khác khung ===== */
.product-card img {
width: 100%;
height: 160px;
object-fit: cover;
border-radius: 6px;
}
</style>
</head>
<body>
<header class="navbar">
<div class="logo">ShopABC</div>
<ul class="nav-links">
<li><a href="#">Trang chủ</a></li>
<li><a href="#">Sản phẩm</a></li>
<li><a href="#">Liên hệ</a></li>
</ul>
<button class="btn-cart">🛒 Giỏ hàng</button>
</header>
<section class="banner">
<h1>Ưu Đãi Mùa Hè</h1>
<p>Giảm giá lên đến 50% cho tất cả sản phẩm</p>
</section>

<div class="page-container">
<div class="product-grid">
<div class="product-card">
<img src="https://picsum.photos/id/21/300/400" alt="Sản phẩm 1">
<p>Áo thun trắng</p>
</div>
<div class="product-card">
<img src="https://picsum.photos/id/103/400/250" alt="Sản phẩm 2">
<p>Giày sneaker</p>
</div>
<div class="product-card">
<img src="https://picsum.photos/id/28/500/300" alt="Sản phẩm 3">
<p>Quần jean</p>
</div>
</div>
</div>
</body>
</html>
